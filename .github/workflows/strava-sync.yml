name: Parse Strava Export

on:
  push:
    paths:
      - 'activities.csv'
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parse Strava export
        run: python scripts/parse_export.py

      - name: Commit strava-data.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add strava-data.json
          git diff --cached --quiet || git commit -m "chore: update strava data from export"
          git push
