name: Sync Garmin Data

on:
  schedule:
    - cron: '0 8 * * *'   # daily at 08:00 UTC (~04:00 ET) — after overnight watch sync
  workflow_dispatch:

# Never let this race the Strava rebuild — both commit strava-data.json
concurrency:
  group: activity-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install garminconnect

      - name: Fetch Garmin activities
        id: fetch
        env:
          GARMINTOKENS: ${{ secrets.GARMINTOKENS }}
          GARMIN_TOKEN_OUT: ${{ runner.temp }}/garmin_tokens_refreshed.json
        run: |
          # Garmin's private API is occasionally flaky — retry before failing.
          # `|| EXIT_CODE=$?` is required: steps run under `bash -e`, so a bare
          # failing command would abort the loop before we could retry.
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt/3 ==="
            EXIT_CODE=0
            python scripts/fetch_garmin.py || EXIT_CODE=$?
            if [ $EXIT_CODE -eq 0 ]; then exit 0; fi
            echo "::warning::Attempt $attempt/3 failed (exit $EXIT_CODE)"
            if [ $attempt -lt 3 ]; then
              echo "Waiting 60s before retry..."
              sleep 60
            else
              echo "::error::All 3 attempts failed. Look for FATAL: lines above."
              exit 1
            fi
          done

      # Garmin rotates the refresh token on every use and invalidates the old
      # one. Without writing the new value back, the stored secret is good for
      # exactly one refresh and every later run 401s. GITHUB_TOKEN cannot write
      # secrets, so this needs a PAT with secrets:write on this repo.
      - name: Persist rotated Garmin token
        if: steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          TOKEN_FILE: ${{ runner.temp }}/garmin_tokens_refreshed.json
        run: |
          if [ ! -f "$TOKEN_FILE" ]; then
            echo "Token unchanged this run — nothing to persist."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Garmin rotated the token but GH_SECRETS_PAT is not set,"
            echo "::warning::so it cannot be saved. The next run will fail with a 401."
            echo "::warning::Add a PAT with secrets:write as GH_SECRETS_PAT to fix this."
            exit 0
          fi
          gh secret set GARMINTOKENS --repo "$GITHUB_REPOSITORY" < "$TOKEN_FILE"
          echo "Updated GARMINTOKENS with the rotated session."
          shred -u "$TOKEN_FILE" 2>/dev/null || rm -f "$TOKEN_FILE"

      - name: Log failure details
        if: failure() && steps.fetch.outcome == 'failure'
        run: |
          echo "::error::garmin-sync failed. Common causes:"
          echo "  1. 'Failed to retrieve social profile' / 401 — the stored refresh"
          echo "     token was consumed. Garmin rotates it on every refresh, so it"
          echo "     must be written back (needs the GH_SECRETS_PAT secret). Re-mint"
          echo "     with 'python scripts/fetch_garmin.py --login' and update GARMINTOKENS."
          echo "  2. Garmin changed their private API — check for a garminconnect release."
          echo "  3. Rate limited / temporary Garmin outage — re-run the workflow."
          echo "  The site keeps serving the last committed strava-data.json meanwhile."

      - name: Rebuild site data
        run: python scripts/build_data.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add strava-data.json data/
          git diff --cached --quiet || git commit -m "chore: sync Garmin activity data"
          git pull --rebase origin main
          git push
