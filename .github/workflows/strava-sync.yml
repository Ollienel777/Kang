name: Parse Strava Export

# Manual fallback path. Garmin is the primary source (garmin-sync.yml); this
# picks up activities that were uploaded straight to Strava and never recorded
# on the watch. Drop a fresh activities.csv in the repo root and push.

on:
  push:
    paths:
      - 'activities.csv'
  workflow_dispatch:

# Never let this race the Garmin sync — both commit strava-data.json
concurrency:
  group: activity-data
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parse Strava export
        run: python scripts/parse_export.py

      - name: Rebuild site data
        run: python scripts/build_data.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add strava-data.json data/
          git diff --cached --quiet || git commit -m "chore: rebuild activity data from Strava export"
          git pull --rebase origin main
          git push
