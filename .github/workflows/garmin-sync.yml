name: Sync Garmin Data

on:
  schedule:
    - cron: '0 8 * * *'   # daily at 08:00 UTC (~04:00 ET) — after overnight watch sync
  workflow_dispatch:

# Never let this race the Strava rebuild — both commit strava-data.json
concurrency:
  group: activity-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install garminconnect

      - name: Fetch Garmin activities
        id: fetch
        env:
          GARMINTOKENS: ${{ secrets.GARMINTOKENS }}
        run: |
          # Garmin's private API is occasionally flaky — retry before failing.
          # `|| EXIT_CODE=$?` is required: steps run under `bash -e`, so a bare
          # failing command would abort the loop before we could retry.
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt/3 ==="
            EXIT_CODE=0
            python scripts/fetch_garmin.py || EXIT_CODE=$?
            if [ $EXIT_CODE -eq 0 ]; then exit 0; fi
            echo "::warning::Attempt $attempt/3 failed (exit $EXIT_CODE)"
            if [ $attempt -lt 3 ]; then
              echo "Waiting 60s before retry..."
              sleep 60
            else
              echo "::error::All 3 attempts failed. Look for FATAL: lines above."
              exit 1
            fi
          done

      - name: Log failure details
        if: failure() && steps.fetch.outcome == 'failure'
        run: |
          echo "::error::garmin-sync failed. Common causes:"
          echo "  1. GARMINTOKENS expired — re-run 'python scripts/fetch_garmin.py --login'"
          echo "     locally and update the repo secret."
          echo "  2. Garmin changed their private API — check for a garminconnect release."
          echo "  3. Rate limited / temporary Garmin outage — re-run the workflow."
          echo "  The site keeps serving the last committed strava-data.json meanwhile."

      - name: Rebuild site data
        run: python scripts/build_data.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add strava-data.json data/
          git diff --cached --quiet || git commit -m "chore: sync Garmin activity data"
          git pull --rebase origin main
          git push
