name: Sync Strava Data

on:
  schedule:
    - cron: '0 3 * * *'   # daily at 3am UTC
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Strava data
        id: fetch
        env:
          STRAVA_CLIENT_ID:     ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: |
          # Retry up to 3 times with a 30s pause — handles transient Strava API hiccups
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt/3 ==="
            python scripts/fetch_strava.py 2>&1
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 0 ]; then
              echo "last_attempt=$attempt" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Attempt $attempt/3 failed (exit $EXIT_CODE)"
            if [ $attempt -lt 3 ]; then
              echo "Waiting 30s before retry..."
              sleep 30
            else
              echo "::error::All 3 attempts failed. Check the logs above for FATAL: lines."
              echo "last_attempt=$attempt" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          done

      - name: Log failure details
        if: failure() && steps.fetch.outcome == 'failure'
        run: |
          echo "::error::strava-sync failed after ${{ steps.fetch.outputs.last_attempt }} attempt(s)."
          echo "Common causes:"
          echo "  1. Strava returned empty body (transient) — re-run the workflow"
          echo "  2. STRAVA_REFRESH_TOKEN expired — re-authorise at strava.com/settings/api"
          echo "  3. Rate limit hit (>1000 req/day) — wait until midnight UTC"

      - name: Commit strava-data.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add strava-data.json
          git diff --cached --quiet || git commit -m "chore: sync Strava data"
          git push
